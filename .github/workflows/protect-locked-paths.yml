name: protect-locked-paths
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  locked-paths:
    runs-on: ubuntu-latest
    steps:
      # Check out the BASE commit, so the guard script, locked-paths list and this check's
      # logic all come from the base ref. A PR cannot change the rules it is judged by.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head commit (data only, never executed)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head"
      - name: Fail if the change touches any locked path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/locked-paths.mjs "$BASE_SHA" "$HEAD_SHA"
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:self-model
      - run: npm test
