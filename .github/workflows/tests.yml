name: tests
# Plain pull_request on purpose: PR code runs here, so no secrets and a read-only token.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:self-model
      - run: npm test
  tests:
    needs: node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.node.result }}" = success