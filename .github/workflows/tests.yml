name: tests
# Plain pull_request on purpose: PR code runs here, so no secrets and a read-only token.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:self-model
      - run: npm test
